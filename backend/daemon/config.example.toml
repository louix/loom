# Copy to .loom/config.toml to override. Every key below is optional and shown
# with its built-in default. Consumed so far (milestones 1-5): db, run_isolation,
# daemon.*, base_branch, worktree_dir, providers.claude.* and the [[mcp]] list
# (mounted into every session, alongside the built-in in-process `loom` server:
# ask_user + commit). The terminal UI (`loom` with no command in a TTY) reads no
# config of its own; its `Ctrl-E` handoff uses $VISUAL / $EDITOR. The rest is
# carried for later milestones.

base_branch = "main" # each session branches loom/<slug> off this
# (falls back to HEAD if the branch is missing)
worktree_dir = ".loom/trees"
db = ".loom/loom.db"
run_isolation = "in-process" # or "subprocess" (later milestones)

[worktree]
enabled = true # true: each session gets its own git worktree + branch.
# false: sessions run in the repo working dir — no branch
# isolation, concurrent sessions can collide, and hard-fork
# is unavailable (undo still works). `loom run --in-place` /
# `--worktree` overrides this per session.

[auto_rebase] # keep each session's branch current with its base
enabled = false # true: when a session goes idle and the base branch has
# advanced, replay its branch onto the new base (clean tree
# only). A clean replay is silent; a conflict — or an
# uncommitted worktree — asks the agent to integrate the
# base itself. Never fetches; reacts to the local base ref.
mode = "rebase" # "rebase" (linear history) | "merge" (a merge commit)

[commit_reminder] # nudge the agent about an uncommitted worktree at end of turn
enabled = true # when a session goes idle with uncommitted changes in its
#                worktree, send it a one-off message suggesting it commit. One
#                per commit boundary — a tree left dirty on purpose stops
#                nagging until the next commit. Never commits anything itself.
[auto_resume] # re-drive agents a daemon restart cut off mid-turn
enabled = true # when the daemon starts and finds sessions the previous
#               instance left actively working (running / working_background),
#               revive them from their persisted transcript and send a message
#               telling the agent to continue. Sessions blocked on a permission
#               or question (awaiting_input) always stay interrupted — Loom
#               never answers those by itself.

[daemon]
idle_shutdown_minutes = 30 # exit after N min with no sessions and no clients; 0 disables
event_buffer_size = 4096 # push-stream ring buffer, in frames

[providers.claude]
model = "claude-sonnet-5"
# models           = ["opus", "sonnet", "haiku"]
# the M / ⌥p picker list. Omit it and the daemon
# asks the Claude CLI for its catalog at start-up.
permission_default = "manual" # manual (aka default) | plan | acceptEdits | auto
setting_sources = ["project"] # loads CLAUDE.md / project settings
disable_builtin = ["Grep", "Glob"]
cli_path = "" # "" = use `claude` on PATH, else the SDK's bundled
# binary. Set this where the bundled ELF won't run
# (NixOS, musl, minimal containers).
prompt_cache_ttl = "1h" # "5m" | "1h" | "" (let the CLI decide: 1h on a
# subscription, 5m on an API key). Pinning it makes
# the TUI's cache-liveness countdown exact; 1h cache
# writes cost more on metered billing.

# Claude profiles — each is a `~/.claude`-style config dir exposed as its own
# provider (dir handed to the CLI as CLAUDE_CONFIG_DIR). Omit this and you get
# one profile, `~/.claude`, with the id `claude`. The first / unnamed entry
# keeps the id `claude`; a named one gets `claude:<slug>` (e.g. `claude:work`)
# and shows its OAuth login method + org in the Detail pane. `model` /
# `cli_path` / `prompt_cache_ttl` above are shared across all profiles.
# [[claude_profiles]]
# dir = "~/.claude"                   # required
# [[claude_profiles]]
# dir   = "~/.claude-work"
# name  = "Work"                      # → id "claude:work", Detail-pane label
# color = "yellow"                    # Fleet-row id colour; "" → auto from a palette

# This file is the per-repo layer. A user-level file at
# $XDG_CONFIG_HOME/loom/config.toml (→ ~/.config/loom/config.toml) is loaded
# *under* it — put provider profiles + credentials there and let each repo
# override model / base_branch / [[mcp]]. Same schema; a per-repo key wins.

# default_provider = "claude"       # which provider new sessions use when the
# client doesn't name one (must be configured)

# Non-Claude providers (milestone 10) run on the Vercel AI SDK. The @ai-sdk/*
# package for a backend is loaded only when a session actually uses it.
#
# [custom-provider.<id>] — an OpenAI-compatible endpoint (OpenAI itself,
# GLM/Zhipu, DeepSeek, OpenRouter, a local vLLM / Ollama). One block per
# endpoint; <id> is the provider id you pass to `loom run --provider`.
# [custom-provider.openai]
# base_url    = "https://api.openai.com/v1"   # required
# api_key_env = "OPENAI_API_KEY"    # env var holding the key; "" if keyless
# api_key     = ""                  # or the key inline — wins over api_key_env,
#                                   # but it's a plaintext secret; prefer the env var
# tag         = "oai"              # short label (Detail pane, `loom providers`)
# color       = "cyan"             # Fleet-row id colour; "" → auto from a palette
# title_model = "gpt-5-mini"        # cheap model for auto-titling; "" → titles.model
# max_steps   = 50                  # tool round-trips per turn segment (1–500). Not a
#                                   # hard limit — a turn still working continues past
#                                   # it; raise for a model that takes many small steps
#
# The model list comes from {base_url}/models, and a new session defaults to the
# last model this provider ran (remembered in the db). Pin one only if the
# endpoint's /models is missing or wrong:
# model  = "gpt-5"                  # force this model
# models = ["gpt-5", "gpt-5-mini"]  # or a fixed picker list
#
# Context windows: a `context_length`-style field on /models rows (OpenRouter,
# sference, vLLM, LiteLLM, LM Studio) is picked up automatically. Pin sizes for
# endpoints that report none — wins over the built-in per-model table:
# model_context = { "zai-org/GLM-5.3-Flash" = 1048576 }
#
# Advertised /models pricing, display names, and reasoning-effort support
# (`supported_reasoning_efforts` / `default_reasoning_effort`, or OpenRouter's
# nested `reasoning` object) are picked up too — a model that advertises efforts
# gets a thinking-level step in the model picker, with the default marked.
# Streaming requests ask for token usage (stream_options.include_usage) by default —
# without it many endpoints report no usage and the context meter stays at 0.
# Set include_usage = false only for an endpoint that rejects the field:
# include_usage = false
#
# [google] / [anthropic] — one native profile each (@ai-sdk/google,
# @ai-sdk/anthropic). The provider id is "google" / "anthropic". base_url is
# optional (override for a proxy); a model is required (no /models probe).
# [google]
# api_key_env = "GEMINI_API_KEY"
# model       = "gemini-2.5-pro"
# models      = ["gemini-2.5-pro", "gemini-2.5-flash"]
#
# [chatgpt] — ChatGPT/Codex subscription, not an OpenAI API key. Run
# `codex login` once; the connector reads ~/.codex/auth.json and refreshes its
# OAuth token when needed. Loom auto-detects this account-specific catalogue.
# [chatgpt]
# model     = "gpt-5.6-terra"       # optional pin / default
# models    = ["gpt-5.6-terra"]     # optional curated picker list
# auth_path = "~/.codex/auth.json" # optional; this is already the default
#
# Low-level escape hatch, if you need several native profiles or an unusual
# combination: [providers.<id>] with adapter = "aisdk" and sdk =
# "openai" | "google" | "anthropic" | "chatgpt". Same fields as above plus `sdk`, and an
# optional `connector = "@scope/pkg"` to route the profile at a connector
# package other than the built-in generic / gemini ones (see docs/connectors.md).

[[mcp]] # mounted into every session, in order, after the
name = "tilth" # built-in `loom` server. The system prompt steers
command = "tilth --mcp --edit" # code reading + editing to tilth and file finding
# / text search to fff; Claude's own Grep / Glob
[[mcp]] # are disabled below (providers.claude.disable_builtin).
name = "fff"
command = "fff-mcp"

[titles]
enabled = true # summarise the first message into a title after turn 1
model = "" # "" = a per-provider cheap default (Haiku for claude)

[pricing]
table = ".loom/models.toml"

[notify]
webhook = "" # best-effort POST on awaiting_input / error when no client attached

[search] # web_search tool for aisdk sessions (Claude
backend = "none" # has its own). "none" | "brave" | "tavily" | "kagi".
api_key_env = "" # env var with the API key; tool is off if unset
# api_base  = ""                   # override the backend URL (proxy / self-host)
max_results = 5
# kagi dials Kagi's hosted MCP server (https://mcp.kagi.com/mcp, the key sent
# as a bearer token — grab one at kagi.com/api/keys); nothing to install.
# api_base points it at a self-hosted kagimcp instead. Kagi formats the
# results itself (its server-side default is 10, so max_results doesn't apply),
# and kagi sessions also get web_fetch — a page's full content as markdown
# (their kagi_extract) — so a search hit can be read in full.
