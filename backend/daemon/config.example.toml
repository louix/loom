# User config: ~/.config/loom/config.toml (or $XDG_CONFIG_HOME/loom/config.toml).
# Global defaults and exact path-scoped [[repo]] overrides live here.
# Repository files are never loaded as configuration.
# Tools are defined by name, then explicitly selected under [session].
# No external tools are selected by default; native agent tools remain available.

base_branch = "main" # each session branches loom/<slug> off this
# (falls back to HEAD if the branch is missing)
worktree_dir = ".loom/trees"
db = ".loom/loom.db"
# default_provider = "claude" # provider used before a session preference is remembered

[worktree]
enabled = true # true: each session gets its own git worktree + branch.
# false: sessions run in the repo working dir — no branch
# isolation, concurrent sessions can collide, and hard-fork
# is unavailable (undo still works). `loom run --in-place` /
# `--worktree` overrides this per session.

[auto_rebase] # keep each session's branch current with its base
enabled = false # true: when a session goes idle and the base branch has
# advanced, replay its branch onto the new base (clean tree
# only). A clean replay is silent; a conflict — or an
# uncommitted worktree — asks the agent to integrate the
# base itself. Never fetches; reacts to the local base ref.
mode = "rebase" # "rebase" (linear history) | "merge" (a merge commit)

[commit_reminder] # nudge the agent about an uncommitted worktree at end of turn
enabled = true # when a session goes idle with uncommitted changes in its
#                worktree, send it a one-off message suggesting it commit. One
#                per commit boundary — a tree left dirty on purpose stops
#                nagging until the next commit. Never commits anything itself.
[auto_resume] # re-drive agents a daemon restart cut off mid-turn
enabled = true # when the daemon starts and finds sessions the previous
#               instance left actively working (running / working_background),
#               revive them from their persisted transcript and send a message
#               telling the agent to continue. Sessions blocked on a permission
#               or question (awaiting_input) always stay interrupted — Loom
#               never answers those by itself.

[daemon]
idle_shutdown_minutes = 30 # exit after N min with no sessions and no clients; 0 disables

[providers.claude]
model = "claude-sonnet-5"
# title_model = "haiku" # optional model for automatic session titles
# models           = ["opus", "sonnet", "haiku"]
# the M / ⌥p picker list. Omit it and the daemon
# asks the Claude CLI for its catalog at start-up.
permission_default = "manual" # manual (aka default) | plan | acceptEdits
setting_sources = ["project"] # loads CLAUDE.md / project settings
disable_builtin = [] # keep native tools available as fallbacks
cli_path = "" # "" = use `claude` on PATH, else the SDK's bundled
# binary. Set this where the bundled ELF won't run
# (NixOS, musl, minimal containers).

# prompt_cache_ttl = "1h" # optional: "5m" or "1h"; omit to let Claude decide

# Claude profiles — each is a `~/.claude`-style config dir exposed as its own
# provider (dir handed to the CLI as CLAUDE_CONFIG_DIR). Omit this and you get
# one profile, `~/.claude`, with the id `claude`. The first / unnamed entry
# keeps the id `claude`; a named one gets `claude:<slug>` (e.g. `claude:work`)
# and shows its OAuth login method + org in the Detail pane. `model` /
# `cli_path` / `prompt_cache_ttl` above are shared across all profiles.
# [[claude_profiles]]
# dir = "~/.claude"                   # required
# [[claude_profiles]]
# dir   = "~/.claude-work"
# name  = "Work"                      # → id "claude:work", Detail-pane label
# color = "yellow"                    # Fleet-row id colour; "" → auto from a palette

# This file holds global defaults and optional path-scoped [[repo]] overrides.
# Repository files are never loaded as configuration. See the example at the end.

# Additional providers
#
# [custom-provider.<id>] — an OpenAI-compatible endpoint (OpenAI itself,
# GLM/Zhipu, DeepSeek, OpenRouter, a local vLLM / Ollama). One block per
# endpoint; <id> is the provider id you pass to `loom run --provider`.
# [custom-provider.openai]
# base_url    = "https://api.openai.com/v1"   # required
# api_key_env = "OPENAI_API_KEY"    # env var holding the key; "" if keyless
# api_key     = ""                  # or the key inline — wins over api_key_env,
#                                   # but it's a plaintext secret; prefer the env var
# tag         = "oai"              # short label (Detail pane, `loom providers`)
# color       = "cyan"             # Fleet-row id colour; "" → auto from a palette
# title_model = "gpt-5-mini"        # optional model for automatic session titles
#
# The model list comes from {base_url}/models, and a new session defaults to the
# last model this provider ran (remembered in the db). Pin one only if the
# endpoint's /models is missing or wrong:
# model  = "gpt-5"                  # force this model
# models = ["gpt-5", "gpt-5-mini"]  # or a fixed picker list
#
# Context windows are discovered from provider metadata.
# Advertised /models pricing, display names, and reasoning-effort support
# (`supported_reasoning_efforts` / `default_reasoning_effort`, or OpenRouter's
# nested `reasoning` object) are picked up too — a model that advertises efforts
# gets a thinking-level step in the model picker, with the default marked.
# Streaming requests ask for token usage (stream_options.include_usage) by default —
# without it many endpoints report no usage and the context meter stays at 0.
# Set include_usage = false only for an endpoint that rejects the field:
# include_usage = false
#
# [google] / [anthropic] — one native profile each (@ai-sdk/google,
# @ai-sdk/anthropic). The provider id is "google" / "anthropic". base_url is
# optional (override for a proxy); a model is required (no /models probe).
# [google]
# api_key_env = "GEMINI_API_KEY"
# model       = "gemini-2.5-pro"
# models      = ["gemini-2.5-pro", "gemini-2.5-flash"]
#
# [chatgpt] — ChatGPT/Codex subscription, not an OpenAI API key. Run
# `codex login` once; the connector reads ~/.codex/auth.json and refreshes its
# OAuth token when needed. Loom auto-detects this account-specific catalogue.
# `code_mode_only` models additionally require the `codex` binary on PATH;
# Loom launches `codex app-server` and supplies the selected tools.
# [chatgpt]
# model     = "gpt-5.6-terra"       # optional pin / default
# models    = ["gpt-5.6-terra"]     # optional curated picker list
# config_dir = "~/.codex-work"     # optional account directory; default is CODEX_HOME or ~/.codex
# codex_cli_path = "/usr/local/bin/codex" # optional; empty uses `codex` on PATH
# codex_builtin_web_search = false # set true to also expose Codex native web search
#
# Additional named accounts use [providers.<id>]. sdk selects the backend:
# "openai" (default), "google", "anthropic", or "chatgpt".
# [providers.work]
# sdk = "chatgpt"
# config_dir = "~/.codex-work"
#
# Definitions do not enable tools. Each session list selects from its group.
# Lists are inherited independently; a repo list replaces its global list.
[session]
local-tools = [] # host commands, e.g. ["tilth", "fff"]
vm-tools = [] # separate offline tool VMs, e.g. ["tilth"]
remote-tools = [] # remote services, e.g. ["kagi"]

[local-tools.tilth]
command = "tilth" # must be installed on the host
args = ["--mcp", "--edit"]
default_for = ["read", "write", "edit"]

[local-tools.fff]
command = "fff-mcp"
default_for = ["find", "grep"]

[vm-tools.tilth]
runtime = "tilth" # bundled by the standard Loom package; no separate prepare needed
# The runtime supplies its command/arguments, repository mounts and offline policy.
default_for = ["read", "write", "edit", "find", "grep"]

# [remote-tools.kagi]
# url = "https://mcp.kagi.com/mcp"
# bearer_token_env = "KAGI_API_KEY"
# bearer_token = "" # optional inline credential; takes precedence over the env var
# default_for = ["web_search", "web_fetch"]
# Only selected tools require installed executables/runtimes/credentials.
# Selecting the same name from multiple groups is an error.

[titles]
enabled = true # summarise the first message into a title after turn 1

# Costs use provider reports and endpoint-advertised pricing.

# Hooks: see README for events, environment variables, and cancellation semantics.
# "notify" is the default and never messages the agent, including on turn_end.
# "check" accepts file_write / turn_end and sends bounded failure output back.
# Repository hook arrays replace user hook arrays; use project to scope entries.
# Each hook runs serially. file_write retains every changed path for $LOOM_FILE.
#
# [[hooks]]
# kind = "check"
# on = "turn_end"
# match = ["**/*.ts"]
# run = "deno task lint"
#
# [[hooks]]
# on = ["waiting", "turn_end"]
# run = 'notify-send "loom" "$LOOM_MESSAGE"'

[notify]
webhook = "" # best-effort POST on awaiting_input / error when no client attached

[search] # web_search tool for aisdk sessions (Claude
backend = "none" # has its own). "none" | "brave" | "tavily".
api_key_env = "" # env var with the API key; tool is off if unset
# api_base  = ""                   # override the backend URL (proxy / self-host)
max_results = 5
# Hosted MCP search services belong in [remote-tools.<name>], as shown above.

# Session VMs mount the full repository, including shared Git hooks/config.

# Default to one VM per regular Claude session. The Linux Nix package bundles
# the runtime; native Claude remains on the host for login/credential renewal.
# History persists outside the worktree; archive retains it, delete removes it.
# [isolation.claude]
# enabled = true
# The same applies to [isolation.codex] and [isolation.aisdk].
# This is a default: use Alt+i in the new-session prompt or --isolation local
# to run a session locally. enabled=false defaults to Local but still allows
# an explicit VM choice when a runtime is configured or bundled. Existing
# sessions keep their mode after a default change; fork to change environments.
# Optional development overrides: artifact = "/path/to/runtime", smolvm = "/path/to/smolvm"

# Per-repo overrides belong in this file. Use an absolute path or ~/path.
# Matching uses the daemon repo root's canonical path, not a session worktree.
# Nested tables merge with global defaults; arrays replace them. No prefix/glob
# matching. Moving a repo requires updating its path. Duplicate paths are errors.
#
# [[repo]]
# path = "~/dev/my-project"
# base_branch = "main"
# [repo.worktree]
# enabled = true
# [repo.session]
# local-tools = []
# vm-tools = ["tilth"]
# remote-tools = []
# Agent VMs reject selected host tools. vm-tools work with host or VM agents.

# Additional HTTPS hosts for commands inside this repo's session/worktree VMs.
# Required provider API hosts are added separately. Exact DNS names, port 443 only.
# Restart the daemon and resume sessions after changes; packaged MCPs stay offline.
# [repo.isolation]
# extra_allowed_hosts = ["registry.npmjs.org"]
# network_presets = ["nix", "javascript"]
# See docs/session-environments.md. Base setup runs only during explicit preparation.
# [repo.isolation.environment]
# nix = true
# command_prefix = ["nix", "develop", "path:.", "--no-write-lock-file", "--command"]
# prepare = "" # optional base setup, only during explicit environment preparation
# timeout_seconds = 900
# Run `loom environment prepare` (or use the Space palette) to warm a repo base.
# Re-preparation keeps sessions running; idle VMs switch to the new base.
# Host worktrees, history and .loom/package-cache survive VM replacement.
# Session init runs once, in VM and non-VM sessions; failure is passed to the agent.
# [[repo.hooks]]
# name = "install dependencies"
# on = "init"
# run = "deno install --frozen"
# timeout = 600

# Optional project provider restrictions. Omit `only` to allow every configured
# provider; an empty list allows none. `disabled` takes precedence over `only`.
# [repo.provider_access]
# only = ["claude:work"]
# disabled = []
#
# Override inherited VM isolation for this project; restart the daemon to apply.
# Existing incompatible sessions become read-only and can be forked.
# [repo.isolation.claude]
# enabled = false

# Optional AISDK session VMs (OpenAI-compatible, Anthropic, Google; not Codex).
# Build with nix build .#aisdk-session-runtime. May also be set per repo.
# [isolation.aisdk]
# artifact = "/absolute/path/to/aisdk-session-runtime"
# smolvm = "/absolute/path/to/smolvm"

# Optional native Codex/ChatGPT session VMs.
# Build with nix build .#codex-session-runtime.
# [isolation.codex]
# artifact = "/absolute/path/to/codex-session-runtime"
# smolvm = "/absolute/path/to/smolvm"
