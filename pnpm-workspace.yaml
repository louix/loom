# Phase 2+ sets this to the real package list. Kept empty for the pnpm-only
# migration so `pnpm install` behaves exactly like the single-package repo.
packages: []

# One content-addressable virtual store shared across every git worktree of this
# repo — the daemon's .loom/trees/* and the user's own sibling / .claude/worktrees
# checkouts — so a per-worktree `pnpm install` is near-instant and near-free on
# disk (node_modules becomes symlinks into the store). Requires pnpm >= 11.23.0
# and the default isolated node-linker.  https://pnpm.io/git-worktrees
virtualStoreType: global

# Match the coding-style dependency convention: exact pins + a release cooldown.
minimumReleaseAge: 10080          # 7 days, in minutes
minimumReleaseAgeExclude:
  # Grandfathered — the exact versions already locked in package-lock.json before
  # this pnpm migration (2026-08-30); they were vetted at the time. The cooldown
  # applies to every *future* `pnpm add`. Remove these once each is >7 days old.
  - "ai"
  - "@ai-sdk/*"
  - "@anthropic-ai/claude-agent-sdk"
  - "@anthropic-ai/claude-agent-sdk-*"

# Dependency lifecycle scripts pnpm is allowed to run. Populated from the first
# `pnpm install` "Ignored build scripts" report; approve each one deliberately.
onlyBuiltDependencies: []
